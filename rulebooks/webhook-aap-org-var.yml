---
- name: Testing var
  hosts: all
 
  sources:
    - name: My webhook source
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 12345
 
  rules:
    - name: Webhook event with a message
      condition:
        all:
          - event.payload.message != ""
      actions:
        - run_workflow_template:
            organization: "{{ org_name | default('Default') }}"
            name: "{{ job_name | default('no-op') }}"
            add_event_uuid_label: true
            include_events: false
            labels:
              - my_test
            job_args:
              extra_vars:
                ansible_event_str: "{{ event | tojson }}"

    - name: When job status is failed
      condition: fact.status is defined and fact.status == "failed"
      action:
        debug:
          msg: "FAILED status: {{ fact.status }}"

