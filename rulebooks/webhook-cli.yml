---
- name: Listen for webhook events
  hosts: all
 
  sources:
    - name: My webhook source
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 12345

  rules:
    - name: Display
      condition:
        all:
          - event.payload.alertGroup == 'Disk'
          - facts.counter == 5
      
      actions:
        - debug:
            msg: "more than 5"
        - set_fact:
            fact:
              counter: 0

    - name: Count
      condition: event.payload.alertGroup == 'Count'
      actions:
        - set_fact:
            fact:
              counter: 5
        - debug:
            msg: "{{ (vars.get('facts', {}).get('counter', 0) | int)  }}"

    - name: Bye message
      condition:
        all:
          - event.payload.message == "bye"
      action:
        debug:
