---
- name: Direct query ServiceNow incident table
  hosts: all
  sources:
    - name: Watch for any updated table
      servicenow.itsm.records:
        table: "{{ snow_table }}"
        interval: "{{ snow_interval }}"
        remote_servicenow_timezone: America/New_York

  rules:
    - name: New incident
      condition: event.sys_id is defined
      actions:
        - print_event:
            pretty: true

